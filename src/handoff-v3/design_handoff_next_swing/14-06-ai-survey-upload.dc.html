<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="board-fonts.css"></helmet>
<div style="min-height:100vh;background:#EDEAE3;color:#1D2420;font-family:Hahmlet,serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 24px 64px">
  <div style="display:flex;align-items:baseline;gap:10px">
    <b style="font-family:Pretendard,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;color:#21402F">06</b>
    <span style="font-size:13px;color:#6E6858">AI 설문 · 스윙 등록</span>
    <span style="font-size:11px;color:#A39C8C;letter-spacing:.12em">허브 · AI 설문</span>
  </div>
  <div style="width:360px;height:740px;background:#FFFDF9;border:1px solid #DDD6C8;border-radius:34px;box-shadow:0 18px 44px -26px rgba(38,40,42,.4);overflow:hidden;display:flex;flex-direction:column">
          <div style="flex:none;background:#F3EFE8;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:400;color:#1D2420"><span style="font-family:var(--font-num)">9:41</span><span style="display:flex;gap:4px;align-items:center"><span style="width:15px;height:9px;border:1px solid #1D2420;border-radius:2px;opacity:.6"></span><span style="width:15px;height:9px;background:#1D2420;border-radius:2px"></span></span></div>
          <div style="flex:none;background:#F3EFE8;height:52px;display:flex;align-items:center;padding:0 12px 0 8px;gap:4px">
            <span style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#1D2420"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="m15 5-7 7 7 7"></path></svg></span>
            <span style="flex:1;text-align:center;font-size:14px;font-weight:600;color:#1D2420">스윙 등록</span>
            <span style="width:40px"></span>
          </div>
          <div style="flex:none;background:#F3EFE8;padding:12px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px">
            <div style="flex:1;display:flex;align-items:center">
              <sc-for list="{{ steps }}" as="step" hint-placeholder-count="3">
                <span style="display:contents">
                  <span style="{{ step.circleStyle }}">{{ step.display }}</span>
                  <span style="{{ step.labelStyle }}">{{ step.label }}</span>
                  <span style="{{ step.lineStyle }}"></span>
                </span>
              </sc-for>
            </div>
            <span style="flex:none;font-family:var(--font-num);font-size:11px;font-weight:700;color:#8A8375;letter-spacing:-.01em">2 / 3</span>
          </div>
          <div style="flex:1;min-height:0;background:#F3EFE8;padding:14px 20px 0;display:flex;flex-direction:column">
            <div style="display:flex;flex-direction:column;gap:6px">
              <span style="font-size:20px;font-weight:400;letter-spacing:-.03em;color:#1D2420;line-height:1.3">스윙 영상을 등록해주세요</span>
              <span style="font-size:13px;color:#6E6858;line-height:1.5">정면 또는 측면, 편한 각도 하나만 등록해주세요.</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;margin-top:16px">
              <span style="font-size:12px;font-weight:600;color:#8A8375;letter-spacing:-.01em">촬영 각도 · 한 각도만 등록</span>
              <div style="display:flex;background:#EAE4D6;border-radius:9px;padding:3px;gap:2px">
                <sc-for list="{{ angleOptions }}" as="opt" hint-placeholder-count="2">
                  <span style="{{ opt.style }}" onClick="{{ opt.onClick }}">{{ opt.label }}</span>
                </sc-for>
              </div>
            </div>
            <div style="margin-top:10px">
              <sc-if value="{{ isFront }}" hint-placeholder-val="{{ true }}">
                <span style="border:1.5px solid #21402F;background:#FFFFFF;border-radius:11px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:7px">
                  <span style="width:32px;height:32px;border-radius:50%;background:#21402F;color:#fff;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span>
                  <span style="font-size:15px;font-weight:600;color:#17301F">정면 영상</span>
                  <span style="font-size:12px;color:#17301F;opacity:.75">✅ 등록 완료</span>
                </span>
              </sc-if>
              <sc-if value="{{ isSide }}" hint-placeholder-val="{{ false }}">
                <span style="border:1.5px dashed #CFC8B8;border-radius:11px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:7px">
                  <span style="width:32px;height:32px;border-radius:50%;background:#EFE9DE;color:#8A8375;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><rect x="3.5" y="7" width="17" height="12.5" rx="2.5"></rect><circle cx="12" cy="13.5" r="3.2"></circle><path d="M9 7l1.5-2.5h3L15 7"></path></svg></span>
                  <span style="font-size:15px;font-weight:600;color:#1D2420">측면 영상</span>
                  <span style="font-size:12px;color:#8A8375">탭해서 업로드</span>
                </span>
              </sc-if>
            </div>
            <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
              <div style="display:flex;flex-direction:column;gap:6px">
                <span style="font-size:12px;font-weight:600;color:#8A8375;letter-spacing:-.01em">스윙타입</span>
                <div style="display:flex;background:#EAE4D6;border-radius:9px;padding:3px;gap:2px">
                  <sc-for list="{{ handOptions }}" as="opt" hint-placeholder-count="2">
                    <span style="{{ opt.style }}" onClick="{{ opt.onClick }}">{{ opt.label }}</span>
                  </sc-for>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px">
                <span style="font-size:12px;font-weight:600;color:#8A8375;letter-spacing:-.01em">클럽 종류</span>
                <div style="display:flex;background:#EAE4D6;border-radius:9px;padding:3px;gap:2px">
                  <sc-for list="{{ clubOptions }}" as="opt" hint-placeholder-count="2">
                    <span style="{{ opt.style }}" onClick="{{ opt.onClick }}">{{ opt.label }}</span>
                  </sc-for>
                </div>
              </div>
            </div>
            <div style="display:flex;gap:9px;background:#FBF8F2;border-radius:11px;padding:11px 14px;margin-top:14px">
              <span style="flex:none;font-size:14px;line-height:1.5">💡</span>
              <span style="font-size:12.5px;color:#1D2420;font-weight:600;line-height:1.6">정면 측면에 따라 측정 가능한 값이 달라집니다.</span>
            </div>
          </div>
          <div style="flex:none;padding:10px 18px 22px;display:flex;gap:8px">
            <span style="flex:none;padding:14px 20px;border:1px solid #E4DED2;border-radius:10px;font-size:15px;font-weight:400;color:#6E6858">이전</span>
            <span style="flex:1;background:#21402F;border-radius:12px;padding:15px;text-align:center;font-size:14.5px;font-weight:600;font-family:var(--font-num);letter-spacing:-.03em;color:#fff;box-shadow:0 8px 18px -10px rgba(31,61,43,.48)">AI 분석 시작하기</span>
          </div>
        </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { hand: '우타', club: '드라이버', angle: '정면' };

  renderVals() {
    const seg = (active) => ({
      flex: 1, textAlign: 'center', padding: '7px 6px', borderRadius: '7px',
      fontSize: '13px', fontWeight: active ? 700 : 500, cursor: 'pointer',
      background: active ? '#FFFFFF' : 'transparent', color: active ? '#1D2420' : '#8A8375',
      boxShadow: active ? '0 1px 3px rgba(29,36,32,.16)' : 'none'
    });

    const handOptions = ['좌타', '우타'].map(label => ({
      label, style: seg(this.state.hand === label), onClick: () => this.setState({ hand: label })
    }));
    const clubOptions = ['드라이버', '아이언'].map(label => ({
      label, style: seg(this.state.club === label), onClick: () => this.setState({ club: label })
    }));
    const angleOptions = ['정면', '측면'].map(label => ({
      label, style: seg(this.state.angle === label), onClick: () => this.setState({ angle: label })
    }));
    const isFront = this.state.angle === '정면';
    const isSide = this.state.angle === '측면';

    const stepDefs = [
      { display: '✓', label: '설문', kind: 'done' },
      { display: '2', label: '영상등록', kind: 'current' },
      { display: '3', label: '분석', kind: 'upcoming' }
    ];
    const steps = stepDefs.map((s, i) => {
      const circleBase = { width: '20px', height: '20px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-num)', fontSize: '10.5px', fontWeight: 700, flex: 'none' };
      const circleStyle = s.kind === 'upcoming'
        ? { ...circleBase, background: 'transparent', border: '1.5px solid #D9D2C2', color: '#A39C8C' }
        : { ...circleBase, background: '#21402F', color: '#fff', boxShadow: s.kind === 'current' ? '0 0 0 3px rgba(33,64,47,.15)' : 'none' };
      const labelStyle = { fontSize: '11px', fontWeight: s.kind === 'current' ? 700 : 500, color: s.kind === 'upcoming' ? '#A39C8C' : (s.kind === 'current' ? '#1D2420' : '#6E6858'), margin: '0 8px 0 6px', whiteSpace: 'nowrap' };
      const lineStyle = i < stepDefs.length - 1
        ? { flex: 1, height: '1.5px', background: s.kind === 'done' ? '#21402F' : '#DED7C7', marginRight: '8px' }
        : { display: 'none' };
      return { display: s.display, label: s.label, circleStyle, labelStyle, lineStyle };
    });

    return { handOptions, clubOptions, angleOptions, isFront, isSide, steps };
  }
}
</script>
</body>
</html>
