<x-dc>
<helmet><link rel="stylesheet" href="board-fonts.css"></helmet>
<div style="min-height:100vh;background:#EDEAE3;color:#1D2420;font-family:Hahmlet,serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 24px 64px">
  <div style="display:flex;align-items:baseline;gap:10px">
    <b style="font-family:Pretendard,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;color:#21402F">01</b>
    <span style="font-size:13px;color:#6E6858">스윙 분석 신청</span>
    <span style="font-size:11px;color:#A39C8C;letter-spacing:.12em">스윙 분석 신청</span>
  </div>
  <div style="width:360px;height:740px;background:#FFFDF9;border:1px solid #DDD6C8;border-radius:34px;box-shadow:0 18px 44px -26px rgba(38,40,42,.4);overflow:hidden;display:flex;flex-direction:column;position:relative;font-family:Pretendard,sans-serif">
          <div style="flex:none;background:#F3EFE8;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:400;color:#1D2420"><span style="font-family:var(--font-num)">9:41</span><span style="display:flex;gap:4px;align-items:center"><span style="width:15px;height:9px;border:1px solid #1D2420;border-radius:2px;opacity:.6"></span><span style="width:15px;height:9px;background:#1D2420;border-radius:2px"></span></span></div>
          <div style="flex:none;background:#F3EFE8;height:52px;display:flex;align-items:center;padding:0 12px 0 8px;gap:4px">
            <span style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#1D2420"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="m15 5-7 7 7 7"></path></svg></span>
            <span style="flex:1;text-align:center;font-size:14px;font-weight:600;color:#1D2420">스윙 분석 신청</span>
            <span style="width:40px"></span>
          </div>
          <div style="flex:none;background:#F3EFE8;padding:0 20px 12px"><span style="display:block;height:4px;border-radius:9px;background:#EFE9DE;overflow:hidden"><span style="display:block;width:33%;height:100%;background:#21402F;border-radius:9px"></span></span></div>
          <div style="flex:1;overflow-y:auto;background:#F3EFE8;padding:16px 20px 24px;display:flex;flex-direction:column">
            <div style="display:flex;flex-direction:column;gap:8px">
              <span style="font-size:25px;font-weight:700;letter-spacing:-.03em;color:#1D2420;line-height:1.3">스윙 영상을 올려주세요</span>
              <span style="font-size:13.5px;font-weight:400;color:#8A8375;line-height:1.6">회원님의 스윙을 직접 확인하고 개선 방향을 알려드립니다.</span>
            </div>

            <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#FFFDF9;border:1px solid #E4DED2;border-radius:10px;margin-top:20px">
              <span style="flex:none;width:24px;height:24px;border-radius:7px;background:#1D2420;color:#fff;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><path d="M12 3.5 19 6v6c0 4-3 7-7 8.5-4-1.5-7-4.5-7-8.5V6z"></path><path d="m9 12 2 2 4-4"></path></svg></span>
              <span style="flex:1;display:flex;flex-direction:column;gap:1px">
                <span style="font-size:10.5px;font-weight:500;color:#A39C8C">담당 프로</span>
                <span style="font-size:12.5px;font-weight:600;color:#1D2420">KPGA Class A 전문교습가</span>
              </span>
              <span style="color:#C6BFB0;display:flex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="m9 5 7 7-7 7"></path></svg></span>
            </div>

            <div style="display:flex;flex-direction:column;gap:9px;margin-top:32px">
              <div style="display:flex;align-items:baseline;justify-content:space-between">
                <span style="font-size:14.5px;font-weight:700;color:#1D2420">업로드된 영상 <span style="font-family:var(--font-num);font-weight:700;letter-spacing:-.03em;color:#8A8375">0/3</span></span>
                <span style="font-size:12px;font-weight:600;color:#21402F;border:1px solid #21402F;border-radius:7px;padding:5px 10px">촬영 가이드</span>
              </div>
              <div style="border:1.5px dashed rgba(33,64,47,.4);background:#F7FAF7;border-radius:14px;padding:22px 16px;display:flex;align-items:center;gap:14px">
                <span style="flex:none;width:44px;height:44px;border-radius:50%;background:#E6EDE7;color:#21402F;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px"><path d="M12 16V5"></path><path d="m7.5 9.5 4.5-4.5 4.5 4.5"></path><path d="M4.5 15v3A1.5 1.5 0 0 0 6 19.5h12a1.5 1.5 0 0 0 1.5-1.5v-3"></path></svg></span>
                <span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:700;color:#1D2420">영상 추가하기</span><span style="font-size:12.5px;color:#8A8375;line-height:1.5">정면과 측면 영상을 함께 등록하면 더욱 정확하게 분석할 수 있습니다.</span></span>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:10px;margin-top:32px">
              <span style="font-size:14.5px;font-weight:700;color:#1D2420">어떤 점이 가장 고민이세요?</span>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                <span style="font-size:13px;font-weight:500;color:#6E6858;background:#EFE9DE;border-radius:9px;padding:9px 14px">방향성</span>
                <span style="font-size:13px;font-weight:700;color:#17301F;background:#E6EDE7;border-radius:9px;padding:9px 14px;box-shadow:inset 0 0 0 1.5px #21402F">비거리</span>
                <span style="font-size:13px;font-weight:500;color:#6E6858;background:#EFE9DE;border-radius:9px;padding:9px 14px">슬라이스</span>
                <span style="font-size:13px;font-weight:500;color:#6E6858;background:#EFE9DE;border-radius:9px;padding:9px 14px">훅</span>
                <span style="font-size:13px;font-weight:500;color:#6E6858;background:#EFE9DE;border-radius:9px;padding:9px 14px">뒤땅</span>
                <span style="font-size:13px;font-weight:500;color:#6E6858;background:#EFE9DE;border-radius:9px;padding:9px 14px">탑핑</span>
                <span style="font-size:13px;font-weight:500;color:#8A8375;background:#EFE9DE;border-radius:9px;padding:9px 14px">더 보기</span>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:6px;margin-top:20px">
              <div style="border:1px solid #E4DED2;border-radius:11px;padding:12px 14px;font-size:13px;color:#A39C8C;line-height:1.6;height:84px;background:#FFFDF9">영상에서 특히 봐줬으면 하는 점을 적어주세요.</div>
              <span style="font-size:12px;color:#8A8375">자세히 적어주시면 피드백이 더 정확해져요</span>
            </div>
          </div>
          <div style="flex:none;padding:10px 18px 20px;background:#FFFDF9;border-top:1px solid #EFE9DE;display:flex;flex-direction:column;gap:8px">
            <span style="text-align:center;font-size:12px;color:#A39C8C;font-weight:500">영상을 등록하면 분석을 요청할 수 있어요</span>
            <span style="display:block;background:#EFE9DE;border-radius:10px;padding:14px;text-align:center;font-size:15px;font-weight:400;color:#A39C8C">스윙 분석 요청하기</span>
          </div>
        </div>
</div>
