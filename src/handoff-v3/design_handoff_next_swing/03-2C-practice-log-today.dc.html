<!DOCTYPE html>
<html>

            </div>

            </div>
            <div style="flex:none;display:flex;flex-direction:column;gap:8px">

              <div style="border:1px solid #E4DED2;background:#FBFAF6;border-radius:11px;padding:12px 14px;min-height:46px"><span style="font-size:12.5px;color:#A39C8C;line-height:1.6">오늘 연습에서 느낀 점을 남겨보세요.</span></div>
            </div>
            <div style="flex:none;display:flex;flex-direction:column;gap:6px">
              <span style="display:flex;align-items:center;gap:10px;border:1.5px solid #21402F;background:#E6EDE7;border-radius:11px;padding:11px 13px">
                <span style="flex:none;width:22px;height:22px;border-radius:7px;background:#21402F;color:#fff;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span>

              </span>

          <div style="flex:none;padding:4px 18px 18px"><span style="display:block;background:#21402F;border-radius:12px;padding:15px;text-align:center;font-size:14.5px;font-weight:600;font-family:var(--font-num);letter-spacing:-.03em;color:#fff;box-shadow:0 8px 18px -10px rgba(31,61,43,.48)">오늘 기록하기</span></div>
