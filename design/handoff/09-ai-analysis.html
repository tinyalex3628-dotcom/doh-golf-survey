<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>09 · AI 분석 결과지</title></head>
<body style="margin:0;background:#B8B8B3;display:flex;justify-content:center;padding:24px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">

<!-- AI 분석 결과지 (점수 표기 없는 확정안). 프로 피드백 결과지와는 별개 화면 -->
<div style="width:360px;height:720px;background:#F2F2F0;color:#1A1A1A;display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex:none;display:flex;justify-content:space-between;align-items:center;padding:11px 16px 3px;font-size:12px;font-weight:700;">
    <span>9:41</span>
    <span style="width:22px;height:11px;border:1.4px solid #1A1A1A;border-radius:3px;display:inline-block;"></span>
  </div>

  <div style="flex:none;display:flex;align-items:center;padding:8px 14px 10px;">
    <span style="width:26px;display:flex;align-items:center;justify-content:center;">
      <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1 1 8l7 7" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span style="flex:1;text-align:center;font-size:14px;font-weight:700;margin-right:26px;">분석 결과</span>
  </div>

  <div style="flex:1;overflow-y:auto;padding:0 16px 16px;">

    <!-- 메타 + 진단 헤드라인 (점수 없음) -->
    <div style="margin-top:4px;">
      <div style="font-size:11.5px;font-weight:700;color:#999;">7월 25일 · 드라이버</div>
      <div style="font-size:23px;font-weight:800;line-height:1.32;margin-top:8px;">임팩트에서<br>골반이 늦게 돌아요</div>
    </div>

    <!-- 영상 -->
    <div style="position:relative;background:#D6D6D3;border-radius:13px;height:200px;margin-top:14px;overflow:hidden;">
      <span style="position:absolute;top:10px;left:10px;background:#3A3A36;color:#EDEDE8;font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:6px;">문제 구간 · 임팩트 P4</span>
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#FFF;display:flex;align-items:center;justify-content:center;">
        <svg width="14" height="16" viewBox="0 0 14 16" fill="none"><path d="M2 1.5 13 8 2 14.5z" fill="#1A1A1A"/></svg>
      </span>
      <span style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:9px;padding:9px 11px;font-size:10px;font-weight:700;color:#4A4A46;">
        <span>0:00</span>
        <span style="flex:1;height:3px;border-radius:99px;background:#BEBEBA;position:relative;">
          <span style="position:absolute;left:0;top:0;bottom:0;width:34%;border-radius:99px;background:#6E6E68;"></span>
          <span style="position:absolute;left:34%;top:-3px;width:9px;height:9px;border-radius:50%;background:#2A2A28;"></span>
        </span>
        <span>0:02</span>
      </span>
    </div>

    <!-- 반복 재생 안내 -->
    <div style="display:flex;align-items:center;gap:7px;background:#E6E6E2;border-radius:10px;padding:9px 12px;margin-top:12px;">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7a5 5 0 1 1 1.6 3.7" stroke="#666" stroke-width="1.6" stroke-linecap="round"/><path d="M2 4.2V7h2.8" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size:12.5px;font-weight:700;color:#666;">이 구간만 0.25배속으로 반복 재생 중</span>
    </div>

    <!-- 먼저 고칠 것 -->
    <div style="border-left:2.5px solid #2A2A28;padding-left:12px;margin-top:16px;">
      <div style="font-size:11.5px;font-weight:800;color:#666;">먼저 고칠 것</div>
      <div style="font-size:14px;font-weight:600;line-height:1.62;margin-top:4px;">어깨보다 하체가 먼저 리드되도록 연습해보세요.</div>
    </div>

    <!-- 유지할 것 -->
    <div style="border-left:2.5px solid #D6D6D3;padding-left:12px;margin-top:14px;">
      <div style="font-size:11.5px;font-weight:800;color:#999;">유지할 것</div>
      <div style="font-size:14px;font-weight:600;line-height:1.62;margin-top:4px;">백스윙 템포가 안정적이에요. 3주째 흔들림 없이 같은 리듬입니다.</div>
    </div>

    <!-- 프로 연결 -->
    <div style="background:#E8E8E4;border:1px solid #DBDBD6;border-radius:14px;padding:14px;margin-top:18px;">
      <div style="font-size:12.5px;color:#666;line-height:1.62;">AI는 영상 각도만 보고 판단해요. 골반이 늦은 게 <b style="color:#1A1A1A;">유연성 때문인지 습관 때문인지</b>는 사람이 봐야 압니다.</div>
      <div style="display:flex;align-items:center;gap:9px;margin-top:12px;padding-top:12px;border-top:1px solid #D5D5D0;">
        <span style="font-size:9px;font-weight:800;background:#2A2A28;color:#F2F2F0;padding:3px 6px;border-radius:4px;">PRO</span>
        <span style="flex:1;font-size:13.5px;font-weight:800;">이도형 프로에게 이 영상 보내기</span>
        <svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="m1 1 5 5-5 5" stroke="#999" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

  </div>

  <div style="flex:none;padding:12px 16px 20px;background:#F2F2F0;">
    <div style="background:#2A2A28;color:#F5F5F0;border-radius:14px;padding:16px;text-align:center;font-size:15px;font-weight:800;">내일 이 드릴 하고 다시 찍기</div>
  </div>

</div>

</body>
</html>
