<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>07 · 사진 비교 크게 보기</title></head>
<body style="margin:0;background:#B8B8B3;display:flex;justify-content:center;padding:24px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">

<!-- 결과지에서 "크게 보기" 또는 사진을 눌렀을 때 덮이는 전체화면 -->
<div style="width:360px;height:720px;background:#1C1C1A;color:#EDEDE8;display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex:none;display:flex;justify-content:space-between;align-items:center;padding:11px 16px 3px;font-size:12px;font-weight:700;color:#EDEDE8;">
    <span>9:41</span>
    <span style="width:22px;height:11px;border:1.4px solid #EDEDE8;border-radius:3px;display:inline-block;"></span>
  </div>

  <div style="flex:none;display:flex;align-items:center;padding:10px 16px 12px;">
    <span style="flex:1;font-size:13px;font-weight:800;">톱 자세 · 한 달 변화</span>
    <span style="width:28px;height:28px;border-radius:50%;background:rgba(237,237,232,.14);display:flex;align-items:center;justify-content:center;">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1.5 1.5 10.5 10.5M10.5 1.5 1.5 10.5" stroke="#EDEDE8" stroke-width="1.7" stroke-linecap="round"/></svg>
    </span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 16px;">

    <div style="display:flex;gap:10px;">
      <div style="flex:1;">
        <div style="height:250px;border-radius:12px;background:#4A4A46;"></div>
        <div style="font-size:11px;font-weight:800;color:#EDEDE8;opacity:.7;margin-top:9px;text-align:center;">5월 27일 · BEFORE</div>
      </div>
      <div style="flex:1;">
        <div style="height:250px;border-radius:12px;background:#6E6E68;"></div>
        <div style="font-size:11px;font-weight:800;color:#EDEDE8;margin-top:9px;text-align:center;">6월 27일 · AFTER</div>
      </div>
    </div>

    <div style="background:rgba(237,237,232,.1);border-radius:12px;padding:14px 15px;margin-top:20px;">
      <div style="font-size:10px;font-weight:800;letter-spacing:.12em;opacity:.6;">이도형 프로</div>
      <div style="font-size:13.5px;font-weight:600;line-height:1.7;margin-top:7px;">골반이 열리는 순서가 달라졌어요. 왼쪽은 상체가 먼저, 오른쪽은 하체가 먼저입니다.</div>
    </div>

  </div>

  <div style="flex:none;padding:16px 16px 24px;">
    <div style="background:rgba(237,237,232,.14);border-radius:13px;padding:14px;text-align:center;font-size:14px;font-weight:700;color:#EDEDE8;">이미지로 저장하기</div>
  </div>

</div>

</body>
</html>
