<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>02 · 결과지 · 여정 기록 펼침</title></head>
<body style="margin:0;background:#B8B8B3;display:flex;justify-content:center;padding:24px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">

<!-- 01과 같은 화면. "기록 보기"를 눌러 여정 카드가 펼쳐진 상태. 프레임에 보이는 영역만 담음 -->
<div style="width:360px;height:720px;background:#F2F2F0;color:#1A1A1A;display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex:none;display:flex;justify-content:space-between;align-items:center;padding:11px 16px 3px;font-size:12px;font-weight:700;">
    <span>9:41</span>
    <span style="width:22px;height:11px;border:1.4px solid #1A1A1A;border-radius:3px;display:inline-block;"></span>
  </div>

  <div style="flex:none;display:flex;align-items:center;padding:8px 14px 10px;">
    <span style="width:26px;display:flex;align-items:center;justify-content:center;">
      <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1 1 8l7 7" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span style="flex:1;text-align:center;font-size:14px;font-weight:700;margin-right:26px;">No.06 · 6월 레슨</span>
  </div>

  <div style="flex:1;overflow-y:auto;padding:0 16px 16px;">

    <!-- 여정 스트립 (펼침) -->
    <div style="background:#FFF;border:1px solid #E0E0DD;border-radius:14px;padding:13px 14px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span style="font-size:13.5px;font-weight:700;">5개월째 함께 만들고 있어요</span>
        <span style="font-size:11px;font-weight:700;color:#999;">접기</span>
      </div>
      <div style="position:relative;margin-top:13px;">
        <div style="position:absolute;top:6px;left:12%;right:12%;height:2px;background:#CFCFCB;"></div>
        <div style="position:relative;display:flex;">
          <span style="flex:1;text-align:center;">
            <span style="display:block;width:14px;height:14px;border-radius:50%;background:#555;margin:0 auto;"></span>
            <span style="display:block;font-size:10px;font-weight:700;color:#999;margin-top:7px;">3월</span>
            <span style="display:block;font-size:10.5px;font-weight:600;color:#666;margin-top:2px;">슬라이스</span>
          </span>
          <span style="flex:1;text-align:center;">
            <span style="display:block;width:14px;height:14px;border-radius:50%;background:#555;margin:0 auto;"></span>
            <span style="display:block;font-size:10px;font-weight:700;color:#999;margin-top:7px;">4월</span>
            <span style="display:block;font-size:10.5px;font-weight:600;color:#666;margin-top:2px;">뒤땅</span>
          </span>
          <span style="flex:1;text-align:center;">
            <span style="display:block;width:14px;height:14px;border-radius:50%;background:#555;margin:0 auto;"></span>
            <span style="display:block;font-size:10px;font-weight:700;color:#999;margin-top:7px;">5월</span>
            <span style="display:block;font-size:10.5px;font-weight:600;color:#666;margin-top:2px;">하체 리드</span>
          </span>
          <span style="flex:1;text-align:center;">
            <span style="display:block;width:14px;height:14px;border-radius:50%;background:#1A1A1A;border:3px solid #C9C9C4;box-sizing:content-box;margin:-3px auto 0;"></span>
            <span style="display:block;font-size:10px;font-weight:800;color:#1A1A1A;margin-top:7px;">6월</span>
            <span style="display:block;font-size:10.5px;font-weight:700;color:#1A1A1A;margin-top:2px;">왼팔 각</span>
          </span>
        </div>
      </div>

      <!-- 펼쳐진 목록 -->
      <div style="margin-top:14px;padding-top:13px;border-top:1px dashed #DEDEDA;">
        <div style="display:flex;align-items:center;gap:11px;">
          <span style="font-size:10.5px;font-weight:800;color:#999;width:26px;flex:none;">3월</span>
          <span style="flex:1;">
            <span style="display:block;font-size:13px;font-weight:700;line-height:1.4;">슬라이스 잡기</span>
            <span style="display:block;font-size:10.5px;font-weight:600;color:#999;margin-top:2px;">2개월 함께 봤어요</span>
          </span>
        </div>
        <div style="display:flex;align-items:center;gap:11px;margin-top:11px;">
          <span style="font-size:10.5px;font-weight:800;color:#999;width:26px;flex:none;">4월</span>
          <span style="flex:1;">
            <span style="display:block;font-size:13px;font-weight:700;line-height:1.4;">아이언 뒤땅 줄이기</span>
            <span style="display:block;font-size:10.5px;font-weight:600;color:#999;margin-top:2px;">1개월</span>
          </span>
        </div>
        <div style="display:flex;align-items:center;gap:11px;margin-top:11px;">
          <span style="font-size:10.5px;font-weight:800;color:#999;width:26px;flex:none;">5월</span>
          <span style="flex:1;">
            <span style="display:block;font-size:13px;font-weight:700;line-height:1.4;">하체 리드 만들기</span>
            <span style="display:block;font-size:10.5px;font-weight:600;color:#999;margin-top:2px;">2개월 함께 봤어요</span>
          </span>
        </div>
        <div style="display:flex;align-items:center;gap:11px;margin-top:11px;">
          <span style="font-size:10.5px;font-weight:800;color:#999;width:26px;flex:none;">6월</span>
          <span style="flex:1;">
            <span style="display:block;font-size:13px;font-weight:800;line-height:1.4;">톱에서 왼팔 각 잡기</span>
            <span style="display:block;font-size:10.5px;font-weight:700;color:#555;margin-top:2px;">지금 보고 있는 주제</span>
          </span>
        </div>
      </div>
    </div>

    <div style="margin-top:14px;">
      <div style="font-size:11.5px;font-weight:700;color:#999;">이도형 프로 · 6월 27일 받음</div>
      <div style="font-size:22px;font-weight:800;line-height:1.34;margin-top:7px;">하체가 자리를 잡으니<br>왼팔이 보여요</div>
    </div>

    <div style="background:#FFF;border:1px solid #E0E0DD;border-radius:14px;padding:15px 16px;margin-top:12px;">
      <div style="display:flex;gap:10px;align-items:flex-start;">
        <span style="width:22px;height:22px;border-radius:7px;background:#EDEDEA;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.6 7.4 7.4 4.6M5 2.6l.9-.9a2.4 2.4 0 0 1 3.4 3.4l-.9.9M7 9.4l-.9.9a2.4 2.4 0 0 1-3.4-3.4l.9-.9" stroke="#666" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        <span style="flex:1;">
          <span style="display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#999;">지난달 이어서</span>
          <span style="display:block;font-size:14px;font-weight:500;line-height:1.66;margin-top:4px;">3초 멈추기 숙제 하셨죠? 톱이 확실히 안정됐어요. 왼팔은 아직 살짝 접히지만 지난달보다는 훨씬 낫습니다.</span>
        </span>
      </div>
    </div>

  </div>

  <div style="flex:none;padding:12px 16px 20px;background:#F2F2F0;">
    <div style="background:#2A2A28;color:#F5F5F0;border-radius:14px;padding:16px;text-align:center;font-size:15px;font-weight:800;">스윙 올리고 확인받기</div>
  </div>

</div>

</body>
</html>
