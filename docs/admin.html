/* 회원 앱과 같은 토큰을 쓴다. 프로가 보는 화면과 회원이 보는 화면의 색이
   달라지면, 프로가 '회원에게 뭐가 어떻게 보이는지'를 머릿속으로 못 그린다. */
:root{
  --ns-ink:#1D2420; --ns-ink2:#4A4638; --ns-ink3:#686253;
  --ns-green:#21402F; --ns-green2:#1D4534; --ns-bronze:#7D5D2E; --ns-danger:#C0392B;
  --ns-bg:#F3EFE8; --ns-card:#FFFDF9; --ns-sand:#EFE9DE; --ns-line:#E4DED2;
  --ns-soft:#F2F8F4; --ns-white:#FFFFFF;
  --font-num:'Pretendard',-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#E9E5DD;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ns-ink);-webkit-font-smoothing:antialiased}
button,textarea{font-family:inherit}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:11px 18px;background:#1F2A22;color:#EDEDE8}
.top b{font-size:13px;font-weight:700;letter-spacing:.04em}
.top .sub{font-size:11px;font-weight:400;color:rgba(237,237,232,.62)}
.vtab{font-size:12px;font-weight:600;color:rgba(237,237,232,.62);background:transparent;
  border:1px solid rgba(237,237,232,.24);border-radius:8px;padding:6px 13px;cursor:pointer}
.vtab.on{color:#1F2A22;background:#EDEDE8;border-color:#EDEDE8}
html.demo .top{display:none}

/* flex + justify-content:center 로 감싸면, 안쪽 3단이 max-content 로 부풀어
   왼쪽이 화면 밖으로 잘려 나간다. 가운데 정렬은 margin 으로 한다. */
.wrap{padding:14px}
html.pcmode,html.pcmode body{height:100%;overflow:hidden}
html.pcmode .wrap{padding:0}
/* PC — 창을 통째로 쓴다. 프로가 하루에 열 명씩 답하는 작업대라,
   가운데 좁은 상자에 가둬 놓으면 지난 한마디가 계속 잘려서 매번 눌러 봐야 한다. */
.pcbox{width:100%;min-width:0;height:calc(100vh - 47px);min-height:560px;
  background:var(--ns-bg);overflow:hidden}
html.demo .pcbox{height:100vh}
/* 모바일 — 회원 앱 프로토타입과 같은 크기 */
.mobox{width:390px;margin:14px auto;height:760px;background:var(--ns-bg);border:1px solid #DDD6C8;
  border-radius:30px;overflow:hidden;box-shadow:0 18px 44px -26px rgba(38,40,42,.4)}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);z-index:80;
  background:#1F2A22;color:#EDEDE8;font-size:12.5px;font-weight:500;border-radius:11px;
  padding:12px 18px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translate(-50%,0)}

textarea::placeholder{color:#A9A392}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D5CEC0;border-radius:9px;border:2px solid transparent;
  background-clip:content-box}

</style>

        <span style="font-size:11.5px;font-weight:500;color:var(--ns-ink3);line-height:1.6">

  return `<div style="display:flex;flex-direction:column;height:100%;background:var(--ns-bg)">

    <div style="flex:1;overflow-y:auto;padding:13px 14px 16px;display:flex;flex-direction:column;gap:12px">
      ${player(q, '190px')}

      <div data-open style="display:flex;align-items:center;gap:8px;border:1px solid var(--ns-line);
        background:var(--ns-card);border-radius:11px;padding:12px 13px;cursor:pointer">
        <span style="flex:1;display:flex;flex-direction:column;gap:3px">
          <span style="font-size:12.5px;font-weight:700;color:var(--ns-ink)">이 회원을 아는 데 필요한 것</span>

        </span>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--ns-ink3)"

}

/* ── 사진에 선 긋기 ─────────────────────────────────────────────── */

        <span data-undo style="font-size:11.5px;font-weight:600;color:#EDEDE8;

/* ── 회원 카드 (PC 오버레이) ────────────────────────────────────── */
function renderCard() {
  if (!S.hist) return '';
  const q = cur(), m = mem(q);

/* ── 그리기 ─────────────────────────────────────────────────────── */
function render() {
  const pc = S.view === 'pc';
  document.documentElement.classList.toggle('pcmode', pc);
  $('#frame').innerHTML = pc
    ? `<div class="pcbox">${renderPC()}</div>`
    : `<div class="mobox">${renderMO()}</div>`;
  $('#over').innerHTML = renderCard() + renderMark();
  document.querySelectorAll('.vtab').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  wire();
}

function on(sel, ev, fn) { document.querySelectorAll(sel).forEach(e => e.addEventListener(ev, fn)); }

function wire() {
  const q = cur();
  on('[data-q]', 'click', e => {
    S.pick = e.currentTarget.dataset.q;
    if (S.view === 'mo') S.mo = S.done[S.pick] ? 'd' : 'w';
    render();
  });
  on('[data-txt]', 'input', e => {
    S.draft[q.id] = e.target.value;
    const b = $('[data-send]');
    if (b) b.style.opacity = e.target.value.trim() ? 1 : .38;
  });
  on('[data-snip]', 'click', e => {
    const t = $('[data-txt]');
    const add = SNIP[+e.currentTarget.dataset.snip];
    S.draft[q.id] = ((S.draft[q.id] || '') + (S.draft[q.id] ? ' ' : '') + add);
    render();
    const n = $('[data-txt]');
    if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  });
  on('[data-attach]', 'click', () => { S.photo[q.id] = (S.photo[q.id] || 0) + 1; render(); });
  on('[data-mark],[data-shot]', 'click', () => { S.mark = true; render(); });
  on('[data-send]', 'click', () => {
    if (!(S.draft[q.id] || '').trim()) return;
    S.done[q.id] = true;
    if (S.view === 'mo') S.mo = 'd';
    render();
  });
  on('[data-next]', 'click', () => {
    const n = waiting()[0];
    if (n) { S.pick = n.id; if (S.view === 'mo') S.mo = 'w'; }
    else if (S.view === 'mo') S.mo = 'q';
    render();
  });
  on('[data-card]', 'click', () => { S.hist = true; render(); });
  on('[data-cardx],[data-cardbg]', 'click', e => {
    if (e.target === e.currentTarget || e.currentTarget.dataset.cardx !== undefined) { S.hist = false; render(); }
  });
  on('[data-open]', 'click', () => { S.mo = 'h'; render(); });
  on('[data-toW]', 'click', () => { S.mo = 'w'; render(); });
  on('[data-toQ]', 'click', () => { S.mo = 'q'; render(); });
  on('[data-back]', 'click', () => { S.mo = S.mo === 'h' ? 'w' : 'q'; render(); });
  on('[data-play]', 'click', () => toast('영상을 재생합니다'));
  on('[data-speed]', 'click', e => toast(e.currentTarget.dataset.speed + ' 로 봅니다'));
  on('[data-past]', 'click', () => toast('그때 보낸 한마디를 통째로 엽니다'));
  on('[data-vid]', 'click', () => toast('이번 스윙과 나란히 놓고 봅니다'));

  // 사진 마킹 — 끌어서 선 하나
  const cv = $('[data-canvas]');
  if (cv) {
    let from = null;
    const pos = ev => {
      const r = cv.getBoundingClientRect();
      return [(ev.clientX - r.left) / r.width * 300, (ev.clientY - r.top) / r.height * 400];
    };
    cv.addEventListener('pointerdown', ev => { from = pos(ev); cv.setPointerCapture(ev.pointerId); });
    cv.addEventListener('pointerup', ev => {
      if (!from) return;
      const to = pos(ev);
      if (Math.hypot(to[0] - from[0], to[1] - from[1]) > 8)
        S.lines.push([from[0], from[1], to[0], to[1], S.tool]);
      from = null; render();
    });
  }
  on('[data-tool]', 'click', e => { S.tool = e.currentTarget.dataset.tool; render(); });
  on('[data-undo]', 'click', () => { S.lines.pop(); render(); });
  on('[data-markdone]', 'click', () => { S.mark = false; render(); toast('사진에 표시했어요'); });
  on('[data-markbg]', 'click', e => { if (e.target === e.currentTarget) { S.mark = false; render(); } });
}

let tt;
function toast(t) {
  const b = $('#toast');
  b.textContent = t; b.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => b.classList.remove('show'), 1800);
}

document.querySelectorAll('.vtab').forEach(b =>
  b.addEventListener('click', () => { S.view = b.dataset.v; render(); }));
if (/[?&]view=mo/.test(location.search)) S.view = 'mo';
render();

</script>
